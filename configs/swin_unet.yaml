MODEL:
  TYPE: swin
  NAME: swin_unet
  DROP_PATH_RATE: 0.2
  PRETRAIN_CKPT: "./checkpoints/swin_tiny_patch4_window7_224.pth"
  SWIN:
    FINAL_UPSAMPLE: "expand_first"
    EMBED_DIM: 96
    DEPTHS: [ 2, 2, 2, 2 ]
    DECODER_DEPTHS: [ 2, 2, 2, 1]
    NUM_HEADS: [ 3, 6, 12, 24 ]
    WINDOW_SIZE: 7
  RESUME: None 
  DROPOUT_P: 0.2

TRAIN:
  EARLY_STOP_PATIENCE: 30

  OPTIMIZER: 
    NAME: 'AdamW'
    BASE_LR: 5e-4
    WEIGHT_DECAY: 0.0

  SCHEDULER:
    NAME: 'CosineAnnealingLR'
    WARMUP_EPOCHS: 5
    COSINE_T_MAX: 60
    COSINE_ETA_MIN: 1e-8

  LOSS:
    NAME: 'DiceLoss'
    ELN_LOSS: True
    L1_LAMBDA: 1e-4
    L2_LAMBDA: 1e-4

LOG:
  USE_TENSORBOARD: True
  USE_SWANLAB: True
  SAVE_FLAG: True
  MDF_PARAMS: False

DATA:
  BATCH_SIZE: 8
  VALID_BATCH_SIZE: 8
  IMG_SIZE : 224