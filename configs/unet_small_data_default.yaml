MODEL:
  NAME: 'unet'
  RESUME: None 
  DROPOUT_P: 0.2

TRAIN:
  EARLY_STOP_PATIENCE: 30

  OPTIMIZER: 
    NAME: 'AdamW'
    BASE_LR: 5e-4
    WEIGHT_DECAY: 0.0

  SCHEDULER:
    NAME: 'CosineAnnealingLR'
    WARMUP_EPOCHS: 5
    COSINE_T_MAX: 60
    COSINE_ETA_MIN: 1e-8

  LOSS:
    NAME: 'DiceLoss'
    ELN_LOSS: True
    L1_LAMBDA: 1e-4
    L2_LAMBDA: 1e-4

LOG:
  USE_TENSORBOARD: False
  USE_SWANLAB: False
  SAVE_FLAG: False
  MDF_PARAMS: False

DATA:
  NUM_SMALL_DATA: 100
  SPLIT_FLAG: True
  BATCH_SIZE: 1
  VALID_BATCH_SIZE: 1